<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dice Roguelike</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <main id="app">
    <section class="screen title-screen" id="screen-title">
      <p class="eyebrow">Keyi’s table</p>
      <h1 class="brand">Dice Roguelike</h1>
      <p class="lede">Assemble three heroes. Survive twenty fights. Let the dice decide.</p>
      <button type="button" class="btn primary" id="btn-start">Start run</button>
    </section>

    <section class="screen hidden" id="screen-play">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="fight-label">Fight 1</p>
          <h2 id="phase-title">Choose your party</h2>
          <p class="lede small" id="phase-sub"></p>
        </div>
        <div class="mana-chip hidden" id="mana-chip">Mana <strong id="mana-val">0</strong></div>
      </header>

      <div class="battlefield" id="battlefield">
        <div class="side party-side">
          <h3>Party</h3>
          <div class="fighters" id="party-fighters"></div>
        </div>
        <div class="side enemy-side">
          <h3>Foes</h3>
          <div class="fighters" id="enemy-fighters"></div>
        </div>
      </div>

      <div class="log-panel" id="log-panel">
        <h3>Combat log</h3>
        <div class="log" id="combat-log"></div>
      </div>

      <div class="choice-panel hidden" id="choice-panel">
        <div class="choice-grid" id="choice-grid"></div>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
